<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .gridParent div{
            border: 2px solid red;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .gridParent{
            display: grid;
            grid-template-columns:repeat(3,200px) ;
            grid-template-rows: repeat(3,200px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gridParent">
            <div class="1"></div>
            <div class="2"></div>
            <div class="3"></div>
            <div class="4"></div>
            <div class="5"></div>
            <div class="6"></div>
            <div class="7"></div>
            <div class="8"></div>
            <div class="9"></div>
        </div>
    </div>
    <script src="./src/easyLevel.js"></script>
</body>
</html>
