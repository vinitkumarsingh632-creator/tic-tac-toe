<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Impossible Level</title>
    <link rel="stylesheet" href="./src/styles/impossible.css">
</head>

<body>
    <script>
        function closePanel(event) {
            const target = event.target.parentElement;
            target.parentElement.style.display = 'none';
        }
    </script>

    <div class="container">
        <div class="restarting">
            <button id="restartBtn" aria-label="Restart game">↻</button>
          <h1>Impossible <span id="heading">Level</span></h1>
        </div>
        <div id="decisionPanel">
            <div id="childPanel">
                <div>Message</div>

                <div id="message"></div>

                <button onclick="closePanel(event)">Close</button>
            </div>
        </div>

       <div class="gridParent">
    <div class="grid" data-index="0"></div>
    <div class="grid" data-index="1"></div>
    <div class="grid" data-index="2"></div>

    <div class="grid" data-index="3"></div>
    <div class="grid" data-index="4"></div>
    <div class="grid" data-index="5"></div>

    <div class="grid" data-index="6"></div>
    <div class="grid" data-index="7"></div>
    <div class="grid" data-index="8"></div>
</div>

    </div>

    <script src="./src/impossibleLevel.js" type="module"></script>

</body>
</html>
