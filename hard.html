<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./src/styles/hard.css">
</head>

<body>
    <script>
        function closePanel(event) {
            const target = event.target.parentElement;
            target.parentElement.style.display = 'none';
        }
    </script>

    <div class="container">
        <div class="restarting">
            <button id="restartBtn" aria-label="Restart game">↻</button>
          <h1>Hard <span id="heading">Level</span></h1>
        </div>
        <div id="decisionPanel">
            <div id="childPanel">
                <div>Message</div>

                <div id="message"></div>

                <button onclick="closePanel(event)">Close</button>
            </div>
        </div>

        <div class="gridParent">
            <div class="0"></div>
            <div class="1"></div>
            <div class="2"></div>
            <div class="3"></div>
            <div class="4"></div>
            <div class="5"></div>
            <div class="6"></div>
            <div class="7"></div>
            <div class="8"></div>
        </div>

    </div>

    <script src="./src/mediumLevel.js"></script>

</body>
</html>
