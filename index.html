<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/styles/index.css">

  <title>Tic Tac Toe</title>

  <style>
    
  </style>
</head>

<body>

  <img
    class="background"
    src="./bg image.jpg"
    alt=""
  />

  <main class="container">

    <section class="child">

      <h1 class="ptag">
        Tic Tac Toe
      </h1>

      <div class="play-container">

        <a
          class="play-a"
          href="./level.html"
          aria-label="Play Tic Tac Toe"
        >
          <svg
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M12 7L32 20L12 33V7Z"
              fill="white"
            />
          </svg>
        </a>

        <p class="play">
          Tap to Play
        </p>

      </div>

    </section>

  </main>

</body>
</html>
