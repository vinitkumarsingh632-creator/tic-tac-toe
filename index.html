<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tic Tac Toe</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      color: white;
    }

    /* Background */
    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: -1;
    }

    /* Main container */
    .container {
      min-height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Main card */
    .child {
      width: min(90vw, 520px);
      min-height: 280px;

      padding: clamp(2rem, 6vw, 4rem);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      gap: clamp(1.5rem, 4vw, 2.5rem);

      border-radius: 28px;

      background: rgba(49, 192, 38, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Title */
    .ptag {
      font-size: clamp(1.7rem, 6vw, 3rem);
      font-weight: bold;
      text-align: center;
      letter-spacing: 0.08em;
    }

    /* Play section */
    .play-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    /* Play button */
    .play-a {
      width: clamp(65px, 15vw, 90px);
      height: clamp(65px, 15vw, 90px);

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background: rgba(0, 0, 0, 0.75);

      border: 2px solid rgba(255, 255, 255, 0.2);

      text-decoration: none;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .play-a:hover {
      transform: scale(1.1);

      background: rgba(49, 192, 38, 0.9);

      box-shadow:
        0 0 25px rgba(49, 192, 38, 0.6);
    }

    .play-a:active {
      transform: scale(0.95);
    }

    /* Triangle */
    .play-a svg {
      width: 45%;
      height: 45%;
      transition: transform 0.25s ease;
    }

    .play-a:hover svg {
      transform: translateX(3px);
    }

    /* Text below button */
    .play {
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      opacity: 0.75;
      text-align: center;
    }

    /* Small screens */
    @media (max-width: 400px) {
      .child {
        min-height: 250px;
        border-radius: 22px;
      }

      .ptag {
        letter-spacing: 0.04em;
      }
    }

    /* Landscape phones */
    @media (max-height: 500px) {
      .container {
        padding: 1rem;
      }

      .child {
        min-height: 220px;
        padding: 1.5rem;
        gap: 1rem;
      }
    }

    /* Disable hover enlargement on touch devices */
    @media (hover: none) {
      .play-a:hover {
        transform: none;
        background: rgba(0, 0, 0, 0.75);
        box-shadow: none;
      }

      .play-a:hover svg {
        transform: none;
      }
    }
  </style>
</head>

<body>

  <img
    class="background"
    src="./bg image.jpg"
    alt=""
  />

  <main class="container">

    <section class="child">

      <h1 class="ptag">
        Tic Tac Toe
      </h1>

      <div class="play-container">

        <a
          class="play-a"
          href="./level.html"
          aria-label="Play Tic Tac Toe"
        >
          <svg
            viewBox="0 0 40 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M12 7L32 20L12 33V7Z"
              fill="white"
            />
          </svg>
        </a>

        <p class="play">
          Tap to Play
        </p>

      </div>

    </section>

  </main>

</body>
</html>
